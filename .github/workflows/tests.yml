name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -W error -m pytest tests -q
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread general/av-net-scanner.cpp -o av-net-scanner
